name = "obig-menu"
compatibility_date = "2025-01-01"
main = "worker.js"
workers_dev = true          # garde l'ancienne URL active → redirige vers obigfood.com
assets = { directory = ".", binding = "ASSETS", run_worker_first = true }

[[routes]]
pattern = "obigfood.com"
custom_domain = true

[[kv_namespaces]]
binding = "MENU_KV"
id = "b33d89b362324baf89542be94a608640"

[vars]
# ADMIN_KEY est un SECRET Cloudflare (wrangler secret put ADMIN_KEY) — jamais dans ce fichier.
